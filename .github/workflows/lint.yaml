on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

name: lint

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Air
        uses: posit-dev/setup-air@v1

      - name: Lint with air
        run: air format . --check
